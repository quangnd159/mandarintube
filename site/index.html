<body>
<a class="skip" href="#main" data-t="skip">Chuyển đến nội dung</a>
<header class="top">
  <a class="brand" href="/" data-link aria-label="MandarinTube">
    <span class="cell cell-sm" aria-hidden="true"><span class="zh" lang="zh-Hans">听</span></span>
    <span class="brand-name">MandarinTube</span>
  </a>
  <nav aria-label="Menu">
    <a href="/" data-link data-nav="home" data-t="navHome">Trang chủ</a>
    <a href="/?view=channels" data-link data-nav="channels" data-t="navChannels">Kênh</a>
    <a href="/?view=saved" data-link data-nav="saved" data-t="navSaved">Đã lưu</a>
    <a href="/?view=method" data-link data-nav="method" data-t="navMethod">Cách chọn</a>
  </nav>
  <div class="langs" role="group" aria-label="Ngôn ngữ / Language">
    <button class="lang" type="button" data-lang="vi" lang="vi" aria-label="Tiếng Việt" aria-pressed="true">VI</button>
    <button class="lang" type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
  </div>
</header>
<script>
  // Runs before first paint so English visitors never see a flash of Vietnamese.
  try {
    if (JSON.parse(localStorage.getItem("mt.lang")) === "en") {
      document.documentElement.lang = "en";
      var labels = { skip: "Skip to content", navHome: "Home", navChannels: "Channels", navSaved: "Saved", navMethod: "How it’s chosen" };
      document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = labels[el.dataset.t]; });
      document.querySelector('[data-lang="vi"]').setAttribute("aria-pressed", "false");
      document.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true");
    }
  } catch (e) {}
</script>
<main id="main" tabindex="-1"></main>
<noscript><p class="status">MandarinTube cần JavaScript để hiển thị video. MandarinTube needs JavaScript to show videos.</p></noscript>
<script type="module" src="/app.js"></script>
</body>
</html>
